<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="bsa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Industrial Spout Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon Badge -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#111C44" stroke="#2563EB" stroke-width="2"/>
    <!-- Spout Boat Base -->
    <path d="M12 44 C20 40, 40 40, 48 44 L44 50 C36 47, 24 47, 16 50 Z" fill="#0EA5E9" />
    <!-- Spout Neck Tube -->
    <rect x="24" y="24" width="12" height="18" rx="2" fill="#E2E8F0" />
    <!-- Spout Cap with Grip Ridges -->
    <rect x="20" y="14" width="20" height="12" rx="3" fill="url(#bsa-grad)" />
    <line x1="24" y1="17" x2="24" y2="23" stroke="#78350F" stroke-width="1.5"/>
    <line x1="30" y1="17" x2="30" y2="23" stroke="#78350F" stroke-width="1.5"/>
    <line x1="36" y1="17" x2="36" y2="23" stroke="#78350F" stroke-width="1.5"/>
    <!-- Weld Spark Accent -->
    <circle cx="46" cy="16" r="3" fill="#F59E0B" />
  </g>
  <!-- Text Brand -->
  <text x="82" y="38" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">BSA</text>
  <text x="145" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#F59E0B" letter-spacing="0.5">PACKAGING</text>
  <!-- Monospace Subtitle -->
  <text x="83" y="58" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="2">PRECISION SPOUT FIXING &amp; JOB WORK</text>
</svg>
