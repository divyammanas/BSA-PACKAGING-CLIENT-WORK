<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" rx="16" fill="#0B132B" stroke="#2563EB" stroke-width="1.5"/>
  <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">ASSEMBLED CONFIGURATION</text>
  <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Cap Pre-Torqued on Nozzle</text>

  <!-- Pouch & Spout Diagram -->
  <g transform="translate(160, 115)">
    <!-- Stand-Up Pouch Body -->
    <path d="M-60 60 L-40 -10 L40 -10 L60 60 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <line x1="-55" y1="50" x2="55" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F59E0B" text-anchor="middle">BOTTOM FILL HERE</text>

    <!-- Spout Boat Welded to Top -->
    <rect x="-24" y="-18" width="48" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="-10" y="-32" width="20" height="16" fill="#E2E8F0"/>
    <!-- Pre-locked Cap -->
    <rect x="-14" y="-44" width="28" height="14" rx="3" fill="#F59E0B" stroke="#B45309"/>
    
    <!-- Checkmark Badge -->
    <circle cx="35" cy="-35" r="10" fill="#10B981"/>
    <path d="M31 -35 L34 -32 L40 -38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="20" y="155" width="120" height="24" rx="4" fill="#1E293B"/>
  <text x="80" y="171" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">READY TO FILL</text>
</svg>
