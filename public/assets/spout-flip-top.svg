<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="flip-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="flip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="body-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Technical Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#flip-bg)" stroke="#0284C7" stroke-width="2"/>
  
  <!-- "Chaayos-Style / No Lost Caps" Innovation Pill -->
  <rect x="30" y="24" width="220" height="32" rx="16" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
  <text x="140" y="45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">★ NO LOST CAPS UPGRADE</text>

  <!-- Spout Boat Base -->
  <g transform="translate(200, 290)">
    <path d="M-120 0 C-60 -25 60 -25 120 0 C60 25 -60 25 -120 0 Z" fill="url(#body-grad2)" stroke="#94A3B8" stroke-width="2"/>
    <text x="0" y="45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">0.8s WELDED BOAT FLANGE</text>
  </g>

  <!-- Spout Neck Tube -->
  <rect x="165" y="170" width="70" height="90" rx="4" fill="url(#body-grad2)" stroke="#94A3B8" stroke-width="2"/>

  <!-- Tethered Flip-Top Cap with Flexible Living Hinge -->
  <g transform="translate(200, 160)">
    <!-- Base collar locked to neck -->
    <rect x="-42" y="-15" width="84" height="25" rx="5" fill="url(#flip-grad)" stroke="#0284C7" stroke-width="1.5"/>
    
    <!-- Living Hinge on Left -->
    <path d="M-40 -5 C-58 -10, -58 -45, -35 -48" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="-48" cy="-28" r="5" fill="#F59E0B"/>
    
    <!-- Flipped Open Lid angled at 45 deg to showcase tethered convenience -->
    <g transform="translate(-40, -48) rotate(-35)">
      <rect x="-5" y="-15" width="60" height="22" rx="6" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <!-- Internal Sealing Spigot -->
      <rect x="20" y="7" width="12" height="10" rx="2" fill="#78350F"/>
      <!-- Snap-Tab for easy thumb opening -->
      <path d="M55 -8 C62 -8, 62 2, 55 2 Z" fill="#F59E0B"/>
    </g>

    <!-- Liquid Flow Arrow -->
    <path d="M0 -30 L0 -70 M-8 -60 L0 -72 L8 -60" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <text x="35" y="-62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981">DRINK / POUR</text>
  </g>

  <!-- Feature Callout Tag -->
  <g transform="translate(220, 220)">
    <rect x="0" y="0" width="150" height="40" rx="8" fill="#111C44" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="75" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Audible Snap-Lock</text>
    <text x="75" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F59E0B" text-anchor="middle">100% Attached Cap</text>
  </g>
</svg>
