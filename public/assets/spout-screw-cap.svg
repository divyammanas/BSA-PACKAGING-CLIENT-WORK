<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="screw-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="amber-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Technical Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#screw-bg)" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="200" r="160" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Dimension Indicator Lines -->
  <line x1="80" y1="210" x2="80" y2="290" stroke="#64748B" stroke-width="1.5"/>
  <line x1="75" y1="210" x2="85" y2="210" stroke="#64748B" stroke-width="1.5"/>
  <line x1="75" y1="290" x2="85" y2="290" stroke="#64748B" stroke-width="1.5"/>
  <text x="50" y="255" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" transform="rotate(-90 50 255)">MULTI-MM</text>

  <!-- Spout Boat Base (Heat-Sealed into Pouch) -->
  <g transform="translate(200, 290)">
    <!-- Flange Boat Diamond Shape -->
    <path d="M-120 0 C-60 -25 60 -25 120 0 C60 25 -60 25 -120 0 Z" fill="url(#body-grad)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Weld Guide Ribs -->
    <path d="M-90 0 C-40 -15 40 -15 90 0" stroke="#64748B" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="0" y="45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">ULTRASONIC / THERMAL BOAT FLANGE</text>
  </g>

  <!-- Spout Neck Bore with Threads -->
  <g transform="translate(200, 200)">
    <rect x="-35" y="-30" width="70" height="90" fill="url(#body-grad)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Precision Threads -->
    <path d="M-35 0 L35 -10" stroke="#64748B" stroke-width="3"/>
    <path d="M-35 20 L35 10" stroke="#64748B" stroke-width="3"/>
    <path d="M-35 40 L35 30" stroke="#64748B" stroke-width="3"/>
  </g>

  <!-- Tamper-Evident Ring & Screw Cap -->
  <g transform="translate(200, 110)">
    <!-- Screw Cap -->
    <rect x="-48" y="-35" width="96" height="65" rx="8" fill="url(#amber-cap)" stroke="#B45309" stroke-width="2"/>
    <!-- Cap Grip Ribs -->
    <line x1="-36" y1="-25" x2="-36" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="-24" y1="-25" x2="-24" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="-12" y1="-25" x2="-12" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="0" y1="-25" x2="0" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="12" y1="-25" x2="12" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="24" y1="-25" x2="24" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="36" y1="-25" x2="36" y2="20" stroke="#78350F" stroke-width="2.5"/>

    <!-- Tamper Ring Perforation -->
    <rect x="-44" y="32" width="88" height="14" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="-30" cy="39" r="2" fill="#78350F"/>
    <circle cx="0" cy="39" r="2" fill="#78350F"/>
    <circle cx="30" cy="39" r="2" fill="#78350F"/>
  </g>

  <!-- Badge Overlay -->
  <rect x="220" y="30" width="150" height="30" rx="15" fill="#111C44" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="295" y="50" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">TAMPER-EVIDENT</text>
</svg>
