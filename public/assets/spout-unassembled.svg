<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" rx="16" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">UNASSEMBLED CONFIGURATION</text>
  <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Separate Spout Boat &amp; Loose Caps</text>

  <!-- Pouch with Open Spout Bore -->
  <g transform="translate(100, 120)">
    <path d="M-40 50 L-25 -5 L25 -5 L40 50 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="-16" y="-12" width="32" height="10" rx="3" fill="#E2E8F0"/>
    <!-- Open Neck Tube (Top-Fill) -->
    <rect x="-8" y="-26" width="16" height="16" fill="#E2E8F0" stroke="#94A3B8"/>
    <!-- Liquid injection arrow -->
    <path d="M0 -42 L0 -28 M-4 -33 L0 -27 L4 -33" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="35" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8" text-anchor="middle">TOP FILL</text>
  </g>

  <!-- Separate Cap Box/Hopper on Right -->
  <g transform="translate(230, 115)">
    <rect x="-35" y="-15" width="70" height="50" rx="6" fill="#1E293B" stroke="#64748B" stroke-dasharray="3 3"/>
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">CAP HOPPER</text>
    <!-- Loose Caps -->
    <rect x="-20" y="10" width="18" height="12" rx="2" fill="#F59E0B"/>
    <rect x="4" y="8" width="18" height="12" rx="2" fill="#F59E0B"/>
    <rect x="-8" y="20" width="18" height="10" rx="2" fill="#D97706"/>
  </g>

  <rect x="20" y="155" width="140" height="24" rx="4" fill="#1E293B"/>
  <text x="90" y="171" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B" text-anchor="middle">FOR HIGH-SPEED LINES</text>
</svg>
